body:
  text: 凡例往者恭寓先生之孰竊睹其治驗卓絶心欲録其方證輯成一書以備後進之龜鑑矣而先生則以務在濟世不屑瑣瑣録其迹凡其既往之事皆已芒眛無所準據加之恭謁先生已晚得執杖履僅六年且其中間又數歸省疏闕之日居多無奈其所茫眛與不可得而知者故今第從恭耳目所及抄成此一册子然此僅僅者固屬豹文之一斑尚且怏然不慊吾志願待他日旁叩審問補其缺云先生之術專述長沙不自立方雖一藥增減必據仲景而其有實驗者宋元諸家固無論雖俗間所傳不必擯棄務在於取實效何必拘名之為乎故雖為仲景之方或徵之治驗而未見其效者亦皆斥之不妄收録凡若此類先生別有論述今不具贅凡閲此篇如或擬取法者必先審方主治別藥真膺然後可以施其治一不精較或恐誤人師孰亦有藥徵方極之諸書未閲此類者請且勿妄談先生諸治唯從見證不取因脈乃此篇止録證候者以此故也學者幸勿為疏漏居處姓名雖不雅必記之而如狂癲癩風人所隱忌故至此二病率皆除之其他一二準之者又以有所避凡每條亡姓名者皆效此先生嘗謂經穴病名多是後人妄撰也此真發千古之夢夢可謂確言矣而此篇或猶用之者蓋欲人易曉姑仍其舊耳非敢矛盾也幸勿譏乖戾此篇諸治率每診一病並用三方蓋其先後進退各有定法今茲詳録備左券凡欲取法者或閲本文遇不知其用度須按此例知其準的曰某湯者曰某丸若散者臨臥必服一錢曰時攻之者十日若二十日必一用之而其欲用之時須必止他劑獨別用之次日即復故諸湯劑量輕重雖不同大抵以三錢為一貼有時至十錢二十錢之重者別於方名下注之此篇方名有長沙及諸家方書所未載者此皆系師家舊傳之禁方也然有懇請者則不必靳祕矣故唯録其目至其藥劑不復開列附録一卷長門儒官鶴臺先生者行余用志於濟世之術録其無治驗者正諸我先生先生乃因其證候考其主方論之當否所往復者總若干篇雖未涉其實誠能悉長沙之祕奧無復遺撼矣學者或熟之未必無少補也因附録於後云正文山城澱藩士人出下平左衛門者謁先生曰有男生而五歲啞而癇癇日一發或再發虛尫羸憊旦夕待斃且其悶苦之狀日甚一日矣父母之情不忍坐視願賴先生之術幸一見起雖死不悔先生因為診之心下痞按之濡乃作大黃黃連湯飲之百日所痞去而癇弗復發然而胸肋妨張脅下支滿啞尚如故又作小柴胡湯及三黃丸與之時以大陷胸丸攻之可半歲一日乳母擁兒倚門適有牽馬而過者兒忽呼曰牟麻父母喜甚乃襁負俱來告之先生先生試拈糖果以挑其呼兒忽復呼曰牟麻本邦甘美之味總謂之牟麻馬亦謂牟麻國語相通父母以為過願踴躍不自勝因服前方數月言語卒如常兒越中二口誓光寺主僧某者請診治曰貧道眼目非有外瘴礙明然但望物不能久視或強之則無方圓大小須臾漸殺最後如錐芒輒射目中則痛不可忍如此者凡三年先生為診之上氣煩熱體肉瞤動為桂苓朮甘湯及芎黃散服之數十日其視稍真無復錐芒於是僧歸期已迫復謁曰越去京師也殆千里且道路難嶮度難再上病尚有不盡願得授方法以歸也因復診之前證皆除但覺胸脅苦滿乃書小柴胡湯之方以與之僧歸後信服之雖有他證不復他藥一日俄大惡寒四肢戰栗心中煩悶不能氣息弟子驚愕謀延醫治病者掩心徐言曰寧死無他藥矣更復為小柴胡湯連服數劑少焉蒸振煩熱汗溢腹背至是舊疴百患一旦頓除四體清快大異於往常僧乃為之作書走一介謝先生云云州醫生祝求馬年可二十一日忽苦跟痛如錐刺如刀刮不可觸近衆醫莫能處方者有一瘍醫以為當有膿刀劈之亦無效矣於是迎先生診之腹皮攣急按之不弛為芍藥甘草湯飲之一服痛即已京師御幸街賈人菱屋五郎兵衛妻年可三十分身之後通身洪腫腫已則腰腳委不能起居而陰中有二骨突出左右相支百治不收遂不去蓐者凡七歲矣聞先生之名求診治心下痞硬臍傍有塊大如覆杯其脊骨戾曲右排腰眼上者寸許為硝石大圓飲之十餘日陰中大小臭穢三日所痞去塊解於是脊骨復故突出之骨忽亦沒失則能起居浪華士人某者患腹痛可三年性素嗜茄子嘗大食之其痛益甚殆不自勝爾後每日必然以故不復者謁生生求診治時適夏天乃煮熟茄子數枚強飽食之已而心腹果大鳴動痛倍於前日極吐下而後已如此者凡三次能食茄子而不復痛膳所侯臣服久左衛門女初患頭瘡瘳後兩目生翳卒以失明召先生求診治先生診之上逆心煩有時小便不快利為桂苓朮甘湯及芎黃散雜進時以紫丸攻之障翳稍退左目復明於是其族或以為古方家多用峻藥雖障翳退恐至有不諱也久左衛門亦然其言大懼之乃謝罷更召他醫服緩補之劑久之更復生翳漠漠不能見於是久左衛門復謁曰向我女賴先生之庇一目復明而惑人間阻遂復失明今甚悔之幸再治之先生之惠也請甚懇先生因復診之乃服前方數月兩目復明京師界街賈人井筒屋播磨家僕年七十餘自壯年患疝瘕十日五日必一發壬午秋大發腰腳攣急陰卵偏大欲入腹絞痛不可忍衆醫皆以為必死先生診之作大烏頭煎飲之每貼重八錢斯須瞑眩氣絶又頃之心腹鳴動吐出水數升即復故爾後不再發某生徒讀書苦學嘗有所發憤遂倚幾廢寢七晝夜已而獨語妄笑指擲前儒罵不絶口久之人覺其狂疾先生診之胸肋妨脹臍上有動上氣不降為柴胡薑桂湯飲之時以紫丸攻之數日全復常豫州今治林光寺主僧某上人積年患淋疾先生診之心下痞硬腹中雷鳴為半夏瀉心湯及三黃丸飲之三十日所諸證全退京師東洞街賈人大和屋吉五郎每歲發生之時頭面必熱頭上生瘡癢瘙甚搔之即爛至凋落之侯則不藥自已者數年來求診治先生診之心下微動胸股支滿上氣殊甚為柴胡薑桂湯及芎黃散飲之一月所諸證全已爾後不復發京師郊外西罔僧有良山和尚者年七十餘其耳聵者數年嘗聞先生之論百疾生於一毒也深服其理因來求診治先生診之心胸微煩上氣殊甚作桂苓朮甘湯及芎黃散服之數月而未見其效乃謝罷居數日復謁曰謝先生來頗得通聽意者上焦毒頗盡耶先生診之曰未也試再服湯液當復不能聽然後更得能聽其毒信盡也因復服前方數月果如先生之言京師室街賈人升屋德右衛門家僕宇右衛門者年二十有餘積年患癇一月一發或再發或不發然間三月必發先生診視之胸腹微動胸下支滿有時上衝乃作柴胡薑桂湯及滾痰丸飲之時以梅肉散攻之出入一歲所不復發京師烏街賈人泉屋伊兵衛年二十有餘積年患吐血大抵每旬必一動丙午秋大吐吐已則氣息頓絶迎衆醫救之皆以為不可為也於是家人環泣謀葬事先生適至亦使視之則似未定死者因著纊鼻間猶蠕蠕動乃按其腹有微動蓋氣未盡也急作三黃瀉心湯飲之每貼重十五錢須臾腹中雷鳴下利數十行即寤出入二十日所全復故爾後十餘歲不復發京師麩屋街賈人某者患天行痢一醫瘳之雖度數頗減尚下臭穢日一再行飲食無味身體羸瘦四肢無力至其年月益甚衆醫無效先生診之作大承氣湯飲之數日全治丹波青山侯臣蜂太夫疾病而胸中煩悶短氣有渴且其脊骨自七椎至十一椎痛不可忍衆醫皆以為虛作獨參湯飲之凡六日無其效先生診之作石膏黃連甘草湯飲之每貼重三十五錢盡一服痛即已入出五十日所全復常京師河原銜又兵衛者年八十餘恆以賣菜出入先生之家嘗不來者數日使人問之謝曰頃者病慍郁以故不出居數日復問之臍上發癰其徑九寸許正氣乏絶邪熱如憿先生愍其貧困不能藥乃作大黃牡丹湯及伯州散飲之數日膿盡肉生矍鑠能行京師九田街刀屋平八者壬午秋左足發疔瘍醫治之後更生肉莖其狀如蛭用刀截去無知所痛隨截隨長明年別復發疔治則如初爾後歲以為常生肉莖者凡五條上下參差並垂於脛上焉衆醫莫知其故進藥亦皆無效先生曰我亦不知其所因矣然至其治之豈不能乎因診之心胸微煩有時欲飲水腳殊濡弱為越婢加朮附湯及白州散飲之時以梅肉散攻之數日莖皆脫下而愈京師士人某妻善憂恚甚則罵詈不絶口如此者十有餘年某醫瘳之無其效更迓先生求診治先生診之心胸煩悶口舌乾燥欲飲水作石膏黃連甘草湯飲之數月諸證皆除前醫聞之嫉其效謂士人曰婦人久服石膏則絶子種矣余非不能為之惡其不仁也士人亦因其言大憾之來詰先生先生答曰夫婦人之孕與不孕固非人事之所及也況乃草根石屑何能制之且彼於積年已然之疾猶不能治之焉知其未然乎士人歎服而去明年其妻始娠江州大津賈人錢屋七郎兵衛男生而五歲病兼啞癇癇比日必發且其骨體委弱不能自凝坐先生診之胸肋妨張脅下支滿作小柴胡湯及滾痰丸飲之時以紫丸攻之數月稍能用手足癇不復發先生曰更服之啞亦可治然而賈人以其瞑眩頗甚而疑懼不能決託事故謝罷京師麩屋街賈人近江屋嘉兵衛男年十有三患天行痢裡急後重心腹刺痛噤口三日苦楚呻吟四肢撲席諸醫無效先生診之作大承氣湯飲之每貼重十二錢少焉蒸振熱煩快利如傾即愈越中醫生某男年三十所發狂喚叫妄走不避水火醫生頗盡其術而救之一無其效矣於是聞先生之名詳録證候懇求治方其略曰胸膈煩悶口舌乾燥欲飲水無休時先生乃為石膏黃連甘草湯及滾痰丸贈之服百有餘劑全復常丸龜侯臣勝田九八郎女弟患痿癖諸治無效先生診之體內瞤動上氣殊甚為桂苓朮甘湯飲之須臾坐尿二十四行乃忽然起居京南東福寺塔頭松月軒某長老病後肘骨突出不能屈伸先生診之腹皮攣急四肢沉惰有時上逆為桂枝加附子湯及芎黃散飲之時以梅肉散攻之數十日時骨復故屈伸如意一賈人面色紫潤掌中肉脫四肢癢痛衆醫皆以為癩疾處方亦皆無效先生診之胸肋妨張心下痞鞕為小柴胡湯及梅肉散雜進數十日掌肉復故紫潤始退京師生洲松屋源兵衛妻胎孕二三月腰背攣痛四肢沉重飲食無味先生診視之為桂枝加附子湯飲之時以十棗湯攻之每攻諸證漸退及期母子俱無損傷大炊相公臣田太夫憂慮過多久而生熱鬱四肢重惰志氣錯越居常不安灸刺諸藥並無效先生診之作芍藥甘草附子湯飲之數十日更又為七寶丸服之如此者凡六次而全復常其父甲州君年已九十餘生來不信醫藥以為無益至是大崇先生之術謂家人曰豫如有病其所賴唯有東洞而已東洞者先生別號也後數年患傷寒心胸煩熱譫言妄語小便不利不進食者凡六日家人乃召先生視之心胸煩滿四肢微腫乃作茯苓飲飲之吐出水數升而愈初甲州君自年及六十雖盛夏重衣猶寒以為老而衰也自是之後更服綺絺與少壯之時不異矣以此視之蓋病也非老衰也一婦人患黴瘡差後結喉上生血腫大如梅子自以為若急腐潰則呼吸漏泄恐至性命來求診治先生乃作七寶丸飲之一劑其腫移者寸許再服至天突三劑則至華蓋之上乃腐潰而愈京師智恩街紙鋪政右衛門者病後怯悸畏障戶之響其所抵觸皆黏紙條防之居常飲食無味百事皆廢然行步不妨但遇橋梁則乘輿猶不能過百治無效如此者凡三年先生診之上氣殊甚脅下拘滿胸腹有動心中不安作桂苓朮甘湯及芎黃散飲之數日上逆稍減又為柴胡薑桂湯飲之數月諸證皆除居二三日家召蓋匠政右衛門正出廡下自指揮修葺遇有不如意走而上屋就之而不知其蹈梯之易焉久之自覺語之家人余聞之其家人云一京人素剛強臍下發癰使瘍醫治之無其效矣乃自用刀剜之且灸其上汁出而愈而按之硬如石無何之東都道經諏訪浴溫泉即大疼痛不可忍於是自以為初剜猶淺而其根未盡也更又剜之灸其上數十壯少焉腸燒爛水血迸出然其人能食食則清穀出故常以綿縈其腹先生診之乃為大黃牡丹湯及白州散飲之數日全愈京師油街界屋新七通身浮腫腳氣上衝心胸熱煩甚則正氣乏絶晝夜倚壁不能臥進湯即吐衆醫皆以為必死先生作越婢加朮附湯飲之吐尚如故而益飲之不止居五六日心胸稍安藥不復吐於是又作十棗湯飲之吐下如傾諸證傾退京師四條街賈人三井某家僕三四郎者四肢憊惰有時心腹切痛居常鬱郁氣志不樂諸治無效有一醫某者以先生有異能勸迓之賈人曰固聞先生之名然古方家多用峻藥是以懼未請爾醫乃更諭且保其無害遂迓先生診之腹中攣急按之不弛乃作建中湯飲之其夜胸腹煩悶吐下如傾賈人大驚懼召某醫責之醫曰東洞所用非峻劑疾適發動耳賈人尚疑又召先生意欲無復服先生曰余所處非吐下之劑而如此其甚者蓋彼病毒勢已敗無所伏因自潰遁耳不如益攻之也賈人乃服其言先生乃還翌早病者自來謁曰吐下之後諸證脫然頓如平日也有恕首坐者伯州人也遊京師與我輩善首坐一日謁先生曰頃者得鄉信貧道戒師某禪師者病腫脹二便不通衆醫皆以為必死將還侍湯藥願得先生備急丸者而往矣乃作數劑與之比及首坐還禪師僅存呼吸即出備急丸服之下利數十行腫稍減未及十日全愈於是其里中有患癩疾者見其有奇效謁首坐求之診治首坐乃謝曰京師有東洞先生者良醫也千里能瘳疾無所不治向所進禪師固其藥也今又為汝請之其人亦懇託而退首坐復來京師則輒謁先生詳告其證候且懇其治先生乃作七寶丸二劑贈之其人其人服之而全治矣其明年來京師謁先生則已如未病者焉矣京師岩上賈人某者患黴瘡差後鼻梁壞陷殆與兩頰等先生為七寶丸飲之其鼻反腫脹三倍於平人及盡三劑則稍縮收再見全鼻越中僧僧撲者病後失明先生為芎黃散飲之僧喜其快利乃不論量度日夜飲之久之大吐血而性素豪邁益飲之不已卒以復明僧語於人曰當服藥之時每剃髮必聞芎藭之臭蓋其氣能上達也笹山侯臣河合九郎兵衛者一日卒倒呼吸促迫角弓反張不能自轉側急為備急丸飲之每服重五錢下利如傾即復故先生門人備中足守中尾元彌覺腳弱之狀自服平水桃花之輩而其腳益弱然尚服前方不止遂以委弱不能起居於是先生診之為十棗湯及芍藥甘草附子湯雜進芍藥甘草附子湯每貼重十五錢時作礬石湯浸腳數月未見其效生猶服前方不止出入一歲所全愈越中小田中村勝樂寺後住年十三生而病啞其現住來謁曰余後住者不敢願言語能通幸賴先生之術倘得稱佛名足矣其劑峻烈非所畏懼縱及死亦無悔矣先生診之胸肋妨張如有物支之乃為小陷胸湯及滾痰丸與之月餘又為七寶丸飲之數日如此者凡六次出入二歲所乃無不言一男子患黴瘡瘥後骨節疼痛不可忍先生診之為七寶丸飲之喘沫如流齒縫黑血出已而牙齒動搖遂以脫落其人患之無何血止疾瘥其齒復生哺啖健於前云京師烏街賈人菊屋清兵衛者年可三十雅崇先生之術而其家人無一肯之者賈人嘗病心中煩悸飲食不進先生治之數日未見其效於是家人固諭清兵衛召他醫則病勢愈加心悶肩息旦夕將死清兵衛乃嘆曰死則命也棄先生之術死於世醫之手乎嗚呼已矣夫如斯豈天哉於是復召先生時者余亦從往先生診之出而謂余曰死生有命吾非所知也非駃藥救之則彼不足安也而家人知之必復難之夫清兵衛者信乎我者也余豈可以家人而已乎乃為走馬湯飲之下利數十行氣息稍安飲食隨進然而翌早復迫其後三日竟至不可救矣然家人因知先生能守義不拘名利大信先生之術矣嗟呼如清兵衛者可謂能盡人事者矣京師河原街賈人升屋傳兵衛女病衆醫皆以為勞瘵而處方亦皆無效羸瘦日甚旦夕且死賈人素懼古方然以不得已來求診治先生既往診之知其意之不信即謝歸矣逾月其女死其後二年其妹亦病賈人謁曰僕初有五子其四人者皆已亡其病皆勞瘵也蓋齡及十五則其春正月瘵必發至秋八月必皆死矣向先生所診此其一也亦已死矣而今者季子年十七亦病之夫僕固非不知古方有奇效懼其多用峻藥也然願緩補之劑救之不見一有其效矣願先生瘳之縱死無復所悔矣先生為診之氣力沉溺四肢憊惰寒熱往來咳嗽殊甚作小青龍湯及滾痰丸雜進其歲未至八月全復常京師木屋街魚店吉兵衛男年十四歲通身洪腫心胸煩悶小便不利腳殊濡弱衆醫無效先生診之胸脅苦滿心下痞鞕四肢微熱作小柴胡湯飲之盡三服小便快利腫脹隨減未滿十服而全愈京師富街賈人堺屋治兵衛妻積病五年首疾腹痛諸證雜出無復定證其族有醫某者久療之未見其效最後腹肚妨脹倍於平日醫以為必死因謝退於是召先生先生為大承氣湯與之其人未服某醫復至聞先生之主方因謂賈人曰嗟呼如此殆速其死也夫承氣之峻烈譬猶發火銃於腹內懼之不已而賈人以其初久無效竟不聽醫退連服數劑坐廁之後心腹頓安而胸中尚覺喘滿之狀先生又為控涎丹與之其人未服醫復至謂賈人曰承氣尚恐其不勝也況此甚於彼者乎必勿服再三叮囑而去賈人復不聽其夜輒服之翌早吐下如傾胸腹愈安醫復至見其如此歎服去後數日全愈初治兵衛者患腹瀉恆非稀粥不能食然未嘗服藥以為無益見先生殊效始知醫藥可信乃嘆曰先生良醫也豈可病而不治乎遂求之診治為半夏瀉心湯飲之數月腹瀉止而能吃飯越中僧玉潭者病後左足屈縮不能行步乃為越婢加朮附湯飲之時以紫丸攻之每攻其足伸寸許出入三月所行步復常而指頭尚無力不能跂立僧益下之不止一日遽起取架上之物已而自念其架稍高非跂立不能及因復試為之則已如意矣京師木屋街伊賀屋久右衛門家婢患痘布根稠密起發不快煩熱癢渴無少安已而瘡窠黑陷無復潤色衆醫皆以為必死先生診之為紫丸飲之下利數十行翌早盡紅活諸證皆退京師界街儒生曾內記男生而三歲痘前大熱喉干口燥有物自臍下上已衝心胸則咬呀喘渴不勝悶苦痘亦灰色無光衆醫皆謝去先生為紫丸飲之坐廁之後忽發紅澤諸證頓退泉州佐野豪族食野喜兵衛家僕元吉者年二十餘請治曰嗝噎二年所十日五日必發頃者胸腹脹滿舉體愈不安衆醫皆以為不治無一處方者蓋聞先生之論死生者天之所命疾病者醫之所治也等死願死於先生之治幸為瘳之先生為大半夏湯飲之飲輒隨吐每吐必雜黏痰居八九日藥始得下飲食不復吐出入二月所全愈奧州仙台長井屋甚七積年患哮喘大抵每月必發其疾苦甚則熱煩怔忡絶食廢寢喘咳殊甚先生診之為小青龍湯及滾痰丸飲之時以紫丸服百有餘劑全治勢州白子久住莊右衛門伏枕可三年其為疾也口眼喎斜四肢不遂居常唾涎語言難通先生診之為桂枝湯加朮附各三兩飲之時以平水丸雜進出入半歲所全復常京師郊外並罔法金剛院主僧大千長老有時左臂上忽痛俄頃紫筋凸起益痛甚射指頭晝夜廢寢食殆不自勝或五日已或三日已已則筋隨散如平人患之三十餘年謁先生求診治先生診之為桂枝湯加朮附各三兩飲之時以梅肉散雜進久之雖頗奏效而未全治已而每尿必頭眩幾欲倒又為桂苓朮甘湯飲之一月所頭眩止筋不復發居無何有井筒屋幸助者室街賈人也聞長老疾已治謁求診治其證候雖率類長老而當其發時生血色瘤紫筋不起乃為大黃牡丹湯及白州散飲之凡服一百劑全治浪華梶木街賈人尾路屋傳兵衛女患腹滿浪華醫盡其術救之一無其效於是就於先生於京師先生診之為大承氣湯飲之二月所腹全減如平人而按之臍旁有塊尚未解以故與前方不已賈人乃以為無所病託事故謝罷居六月所大便漸燥結飲食頗減一日忽腹痛連嘔吐於是始服先生之明更求診治為大半夏湯飲之數日痛止不復吐乃復為大承氣湯下之十日五日僅一行塊尚如故久之陰中下臭穢下利日十餘行如此者三日所利止塊解頓如平日先生令子干之助四歲而患痘證候甚急也為紫丸飲之雖頗奏其效病勢轉迫卒至不可救矣後數年其妹四歲亦患痘瘡窠概密色亦紫黑呀咬喘鳴不勝悶苦先生亦為紫丸飲之於是族人某者諭曰嚮者或訾先生曰東洞之處方也不論內外諸疾必下之是以竟殺其子矣而今亦下之如有不諱則得無不慈之譏乎先生曰方證相對其毒盛死者是其命也豈拘譭譽而變吾操乎益飲之不休諸證皆退全愈附録病者自小腹臍左右或腰寒戰稍覺寒則心下痞塞胸背刺痛或嘈雜吞酸或吐水足厥冷必欲臥或得食止或得酒止或得溫藥稍止或得莪朮香附子輩稍止病發則氣力沉弱殆欲絶須臾諸證悉退如無病人或日四五發或一二發或有腹痛甚拒食數日不食者或有十餘年者六七年若二三年者婦人産後如此者有經閉如此者有經行如常如此者男子酒色過多患此者有黴瘡愈後然者雖其證有輕重大略同證有冷氣遊走者或有水氣上下者婦人或有水血相交者何方主之有産後新得此病以來二三月者初用檳榔蘇子加大黃湯十貼諸證皆止後用半夏瀉心湯數日而不再發本草升麻條下有形證稍似者伏乞辨考病者覺有物小腹或臍傍奔上則膈中逼喉下如雲煙充塞胸背走痛煩悶沉昏須臾知雲煙者下收則忽然復常平居體中寒冷雖夏月著襪重衣常多憂思恐不能安眠或時覺如梅子物自膈中臨喉門又覺一物如梅子大有皮膚中自胸上達肩至第七八俞邊止凡所患時時變換證候不一然太略如上而飲食如常形色不衰凡患此證甚多雖輕重不同大率如此要之屬癇證何方主之鷓鴣湯三黃白虎鐵砂大黃散桔梗白散大陷胸湯類皆無效間有久服桂枝加龍骨牡蠣湯稍囗囗缺字婦人年可三十患腹脹七八年二倍於臨産腹而青筋凸起其硬如石其初一年所飲食不進氣力沉弱二三年後飲食如常起居動作粗如平人遠步大動作稍難耳二便亦如常病來經水不來今春初診之用桃仁承氣抵當甘遂大黃赤丸鷓鶘鐵砂大黃雙紫丸平水丸類雖稍瀉下腹全不減用巴豆則必吐逆又用雞屎百霜散亦不應此病當如何婦人間有此病或十年二三十年而猶不死一婦人有患此證十七八年夢中有異人授方服之黃水自臍漏出者四五日而腹減復常其方別具鐵砂忍冬二味煎服婦人年可六十去夏患自汗如流日夜不止至八月左右手足不仁腰背麻痹灸灼不知痛諸醫以為痱證百方無效日甚一日至十月請余余以為腳氣蓄水所為用檳榔蘇子加大黃湯二三日則覺腰背手足皮中如蟲行狀指端最甚數十日而稍知痛癢於是用黃耆防己加麻辛桂虎骨湯至臘月中旬手足如常諸證皆已其初大便結澀舌有黃胎右脅有塊時時奔動動則胸痛心悶男子年可六十初患淋疾十年所愈而後患腹中㽱痛又十年所飲食如常外無所苦食後步行則吐水如此者其常也去秋至冬初因監田租日在郊野侵寒觸冷食不進於是每朝吃酒一大碗以當朝食數十日以為常至臘月中旬覺左乳下有物懸著飲食昏停滯乳下不下胃中食後二時所吞酸吐雞卵臭數十回而後稍覺入胃中胸背大痛口渴引飲便祕減正月中旬余診之以為澼飲所為與吳茱萸硝石湯三貼乳下稍開乃與小陷胸加枳實湯三貼乳下洗然乃與半夏瀉心湯二三服後瀉水日數十行覺肩上膈間滴滴有聲須臾脅腹鳴動則洞瀉凡如此者七八日飲食日進證候日快而與藥如故稍稍瀉止諸證悉失壯健如十年前鼓脹兼勞瘵者未見有治效凡察病人水氣為患者十居七八於是觀仲景方治水之劑亦十之七八乃知水之為患大且多矣為醫者留意於此分別表裡高下胃中胃外伏流散凝等從證治起死回生之功亦十之七八矣訶黎勒人唯知止瀉不知逐水法苑珠林引分別功德經云佛弟子博羅療一比丘常苦頭痛與訶子一丸所患遂已其論謂膈間有水上攻故頭痛訶子除水故愈此余所暗記大意如此非彼文者凡中風寒邪者有水迎之故其候有頭痛惡寒汗出痰湧目淚鼻涕一身走痛等類逐水則邪除故汗出而愈於是乎桂枝麻黃細辛半夏乾生薑輩才能可得而知已牡蠣龍骨亦治之之藥蝮蛇箱山錫杖實二味酒浸日乾細末糊丸以酒送下主治主血相結冷氣走痛心胸痞塞虛羸乏力者名二輪丸鼴鼠霜能治顛癇吐涎沫者東洞先生答鶴臺先生書病者自小腹臍左右或腰寒戰雲云此證甚多是留飲病也其處方也假令小腹絞痛腰攣急者烏頭煎湯主之心下痞鞕者附子湯主之胸背刺痛或嘈雜吞酸或吐水或嗜臥兼心下痞鞕則人參湯兼胸脅苦滿則小柴胡湯心下痞鞕腹鳴則半夏瀉心湯心下不痞雷鳴切痛則附子粳米湯心下不痞上逆甚則桂苓朮甘湯上逆而吐水則五苓散也而不問男子婦人産前産後過酒過色唯隨證治之是古之道也足下用檳榔蘇子加大黃湯半夏瀉心湯二方者治則治矣雖然方者有主藥主治知其主藥主治而用之則為古今之法否則雖治不免仲景非其治之議也足下諒察焉來諭曰本草升麻條下有形證稍似者按本草升麻葛根湯異仲景所用也今讀其論以想像推病以不可知為知焉能得功縱有其功偶中耳此方主治頭痛發熱項背強急等之證也時珍不知焉有此證而用之是升麻葛根湯之功也非時珍之功病者覺有物云云此證亦水氣之變而上逆病也故往往與桂苓朮甘湯桂苓味甘湯苓桂甘棗湯輩胸背走痛者每夜用滾痰丸一錢若痛劇者間用控涎丹其如梅子物自膈上達肩也亦唯控涎丹主之若毒著背俞凝然不動則灸如九曜星或五日或七日以散為度而控涎丹逐之然後至自膈中臨喉門之物半夏厚朴湯主之如夫平居苦寒夏月著襪重衣憂思悲恐者兼之於諸病也則非證之確者矣足下以此為屬癇證非矣夫癇間也病有間隙之謂也大抵雜病皆有間也然則何言乎癇何言乎非間且名實之實也名不盡物之狀不如數數焉推實著明也余不名已久矣鷓鴣湯云云方各有主治非其證則無功鷓鴣湯主治吐蛔三黃湯主治心下痞而悸白虎湯主治煩渴桔梗白散主治黏痰或臭膿大陷胸湯主治結胸之疾足下所用無此證也宜哉其不得功桂枝加龍骨牡蠣湯主治胸腹有動上逆干今無上逆而用之故雖有小功乎不全愈也如鐵砂大黃散余未試之一婦人年可三十患腹脹云云腹滿者枳實厚朴之主治也大承氣湯主之近者得一禁方試之血小溲而解今傳之足下足下試之大凡足下所用皆不得方意如此而後有功也偶中不可為法矣桃核承氣湯方不自大承氣湯來自大黃甘草湯來故主治少腹急結者足下失其本何以得效乎諸方皆然足下察諸辱異人之方治腹脹者試以告效一婦人年可六十患自汗云云此證足下以為腳氣也夫腳氣者病特在腳之名也不知大兄何以謂腳氣也若使余從事初大黃附子湯後黃蓍桂枝五物湯乎方不稽古而虛則雖治乎不可為法足下思諸一男子年可六十初患淋疾云云嗚呼得其治哉嗚呼得其治或昔仲景之為方也從證以處亦不問其所因今足下有焉鼓脹兼勞瘵云云後世勞瘵之論不知疾醫之道者之所為焉耳足下所謂勞瘵者不知何等證請再聞其説凡察病人水氣為患者云云夫人之為病毒也無不水穀何則人生入口腹者唯飲食也而其水毒流行一身谷毒止於腸胃故毒物動顯證十七八者水也十二三者谷也足下之論實然世人嘗聞余説者面諛腹非無一可與語者如足下可謂知音矣中風寒邪者有水迎之云云此論千載卓見可謂能知仲景之方矣然不得藥能不能治之得之有道參觀加減之方是也余向録藥徵以備高覽來諭曰牡蠣龍骨治水是蓋非不稽之論乎仲景以牡蠣主治胸腹之動以龍骨主治臍下之動未見其治水足下別有所稽乎請重誨之蝮蛇鼴鼠二方吾其試焉乎意必有效
