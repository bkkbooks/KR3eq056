front:
  text: 序友人岩生受刀圭之術于吉益翁其肆業之餘鋭意操觚又就余而正焉可謂篤志也已一日手册子請余序曰此編雖小也録我先生所治其疾若固若奇皆世醫所不能下手也其他謂病在膏肓者而起之不可勝數也乃別録之不在此數王充曰微病恆醫皆巧篤劇扁鵲乃良若我先生者可不謂良也乎先生常謂曰何病不可愈其不愈也亦惟醫之所為之然而不能生死人起自當生者耳所謂死病無良醫者非不可愈焉命之盡也死生天也非人也命之未盡也何病不可愈矣果信乎先生華於枯肉於骨亦惟古方之用其所用也運用應變卓然自為一家所謂藥不必出扁鵲之方合之者善可以為法者乎非妄言古方之倫也蓋不能用古方也唐而後邪即有用之亦晨星耳不然則畫蛇添足也金張元素曰運氣不齊古今異軌古方新病不相能也其説浸洽後世醫流之肺腑至乃不懼病懼藥使輕病而漸療勿論已所不能愈輒命為廢痼滔滔皆是也此乃先生所為發憤有慨也噫後之醫胡不思也今之天地古之天地陰寒陽溫日居月諸東方自出人字育其中奚古與今異之有而古今異之論猶言卵有毛蛇長於龜公孫白馬之説乎不然則據佛氏之説乎勃窣理窟論愈鑿術愈拙不徒飾言亂實乃為害不鮮矣故此舉也録經實得驗以為同好之弦韋已余聞其言讀其書欣然而謂曰善哉是舉也余自交東洞翁後先耳目其術奏效也以語人則不信者謂阿其所好或為侜張其事溢美其言不然則愕然吐舌以為不近人情也此編出則疑余言者瞭然如觀火知非無稽之言矣其猶為世醫投良藥矣乎除泄其固習之舊毒乎其唯於今乎天下後世蓋聞風焉興者亦或有之亦惟東洞翁之賜而岩生受而施之者乎非邪為岩生請其序書其所論以贈之云爾寶曆癸未之春美濃武欽繇撰序君子行而言焉惡利口之覆邦家者仲景之歿也醫異其學滔滔乎天下唯理是鑿硜硜乎唯論之爭後之讀其書者亦朦然也愈探愈遠書曰靜言庸違信有是也岩生恭在余左右也疾人丐治者於是居多恭執管以記之堆而成卷曰建殊録蓋謂其效之殊於論理之人也余頃者將梓類聚方方極也恭請刻其書余善推功之實審事之情以結狡兒之舌以刮朦士之目使與吾同志者憤然起也遂許就工云寶曆癸未孟春東洞主人撰序夫醫之為職也固人生之所恃則其於朮豈不大乎然上古邈遠其事靡聞周官列其職其人無傳矣戰國之時有越人者而後世傳其籍亦皆妖妄非其真也及東漢之時有張仲景者身為長沙太守憂道之長廢博術古訓選述方法自著論降及後葉無能傳其道者矣於是唐有王孫元有李朱紛然迭起各自論駁惑陰陽之理溺五行之説則末義徒務而至吾道遂熄矣嗚呼孰能力撥帡幪復之其初者乎我東方之盛也文運郁興鴻澤沛溢四海欣欣藜首興仁於是有我東洞先生者出焉憂凡民之固廢原長沙之遺躅潛心焦思覆研推究者三十年於茲矣蓋其在初年也人尚抱疑鮮能信者而及今論益篤也凡四方之士皆莫不造其門者於是古道大辟榛蔽盡除矣則上古之不詳周官之無傳越人之籍之亂其真斯皆可以推知而無後疑矣嗟呼先生之業不亦偉哉不佞恭曩者寓先生之孰蓋有年矣有來請治者則先生必命我輩志其證侯於是恭竊録其治驗之最著明者輯為一卷間者上梓欲傳之同志蓋余聞之巧其言虛其行者其論雖美未足與權矣昔趙括學兵法云兵事以為天下莫能當而及其自率兵與秦戰也一旦亡數十萬之衆身以傾覆以此觀之醫徒誦方籍守脈候空論以誇其伎非要之治驗徵之實效則安足定其優劣亦徒不免為趙括耳是乃先生之所持論而恭之所以有此舉也寶曆癸未之秋播磨岩恭敬甫撰
